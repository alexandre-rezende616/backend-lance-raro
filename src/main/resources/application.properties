# Transforma o banco de dados de "memória RAM" para "arquivo físico" (taverna_db)
spring.datasource.url=jdbc:h2:file:./taverna_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O "update" diz para o Java NUNCA apagar os dados quando reiniciar, apenas atualizar a estrutura
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Habilita o painel de controle do banco
spring.h2.console.enabled=true
